name: deploy-backend

# INF-126, INF-130, INF-131. Builds the API image, publishes it to ghcr.io
# (no Azure Container Registry is provisioned — INF-039) and rolls the Container
# App forward to the immutable SHA tag.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/**"
      - "docker/**"
      - "pnpm-lock.yaml"
      # onlyBuiltDependencies lives here, so this file changes what `pnpm
      # install` does inside the image build. A change to it has to reach prod.
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# INF-132: id-token for the Azure OIDC login, packages for ghcr.
permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lxorb/croco-calc-api
  RESOURCE_GROUP: rg-croco-calc-prod
  CONTAINER_APP: ca-croco-calc-api

jobs:
  deploy:
    name: build, push and roll forward
    runs-on: ubuntu-latest
    environment: prod
    # The image build dominates; 45 minutes is generous but still far below the
    # six-hour default a wedged buildx step would otherwise consume.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # INF-043: the SHA tag is what gets deployed; :latest is convenience only.
      # INF-044: server_version populates /app/backend/dist/server.version.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            server_version=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # INF-042: prove the published image carries no BYPASS_* escape hatch.
      - name: Assert no BYPASS_* in the image
        run: |
          set -euo pipefail
          docker pull "$IMAGE:${{ github.sha }}"
          env_json=$(docker inspect --format '{{json .Config.Env}}' "$IMAGE:${{ github.sha }}")
          echo "$env_json"
          if echo "$env_json" | grep -q "BYPASS_"; then
            echo "::error::the image sets a BYPASS_* environment variable"
            exit 1
          fi

      # INF-085: OIDC federated credentials, no client secret.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Recorded BEFORE the update so the smoke check has something concrete to
      # roll back to. Without this the rollback below could only print advice.
      - name: Record the currently deployed image
        id: previous
        run: |
          set -euo pipefail
          prev=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" -o tsv)
          echo "previously deployed image: $prev"
          echo "image=$prev" >> "$GITHUB_OUTPUT"

      - name: Update the Container App
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}"

      # INF-131
      - name: Smoke check
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::vars.BACKEND_URL is not set — run infra.yml, which writes it from the Terraform output"
            exit 1
          fi
          deadline=$((SECONDS + 120))
          while [ $SECONDS -lt $deadline ]; do
            body=$(curl -sf --max-time 10 "$BACKEND_URL/" || true)
            case "$body" in
              *'"message":"ok"'*)
                echo "$body"
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::error::$BACKEND_URL/ did not return {\"message\":\"ok\"} within 2 minutes."
          exit 1

      # An automatic rollback, not a printed suggestion. This runs only when a
      # previous step failed, so a bad image does not stay live while somebody
      # reads the logs. The job still reports failure regardless of whether this
      # step succeeds — once a step has failed the job outcome is sealed, and a
      # successful rollback must never look like a successful deploy.
      - name: Roll back to the previous image
        if: failure() && steps.previous.outputs.image != ''
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: |
          set -euo pipefail
          if [ "$PREVIOUS_IMAGE" = "$IMAGE:${{ github.sha }}" ]; then
            echo "previous image is the one just deployed; nothing to roll back to"
            exit 0
          fi
          echo "::warning::rolling $CONTAINER_APP back to $PREVIOUS_IMAGE"
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$PREVIOUS_IMAGE"
          echo "rolled back to $PREVIOUS_IMAGE"
