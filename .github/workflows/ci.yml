name: CI

env:
  PNPM_VERSION: "10.28.1"
  NODE_VERSION: "24.11.0"
  # CI compiles the frontend but never deploys it, so these are deliberately
  # throwaway values. Google's public reCAPTCHA test site key is fine here and
  # only here (INF-107 forbids it in production). BACKEND_URL just has to be a
  # real URL that is not monkeytype's, so the INF-013 guard is satisfied without
  # pointing CI at anything live.
  RECAPTCHA_SITE_KEY: "6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
  BACKEND_URL: "http://localhost:5005"

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: group-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  pre-ci:
    name: pre-ci
    runs-on: ubuntu-latest
    outputs:
      should-build-be: ${{ steps.export-changes.outputs.should-build-be }}
      should-build-fe: ${{ steps.export-changes.outputs.should-build-fe }}
      should-build-pkg: ${{ steps.export-changes.outputs.should-build-pkg }}
      styles: ${{ steps.export-changes.outputs.styles }}
    steps:
      - name: Full checkout
        uses: actions/checkout@v6
        # paths filter doesn't need checkout on pr
        if: github.event_name != 'pull_request'

      - name: Detect changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            styles:
              - '**/*.{scss,css}'
              - 'frontend/static/themes/**'
            be-src:
              - 'backend/**/*'
              - 'backend/package.json'
            fe-src:
              - 'frontend/**/*.{ts,tsx,js,scss,html}'
              - 'frontend/**/package.json'
            pkg-src:
              - 'packages/**/*'

      - name: Export changes
        id: export-changes
        run: |
          echo "should-build-pkg=${{ steps.filter.outputs.pkg-src }}" >> $GITHUB_OUTPUT
          echo "should-build-be=${{ steps.filter.outputs.be-src }}" >> $GITHUB_OUTPUT
          echo "should-build-fe=${{ steps.filter.outputs.fe-src }}" >> $GITHUB_OUTPUT
          echo "styles=${{ steps.filter.outputs.styles }}" >> $GITHUB_OUTPUT

  prime-cache:
    name: prime-cache
    runs-on: ubuntu-latest
    needs: [pre-ci]
    steps:
      - name: Checkout pnpm-lock
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache node modules
        id: cache-pnpm
        uses: actions/cache@v5
        env:
          cache-name: node-modules
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-build-${{ env.cache-name }}-${{ hashFiles('pnpm-lock.yaml') }}
          lookup-only: true

      - if: ${{ steps.cache-pnpm.outputs.cache-hit != 'true' }}
        name: Full checkout
        uses: actions/checkout@v6

      - if: ${{ steps.cache-pnpm.outputs.cache-hit != 'true' }}
        name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - if: ${{ steps.cache-pnpm.outputs.cache-hit != 'true' }}
        name: Install dependencies
        run: pnpm install

  check-format:
    name: check-format
    runs-on: ubuntu-latest
    needs: [prime-cache]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: node-modules
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-build-${{ env.cache-name }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm run format-check

  ci-pkg:
    name: ci-pkg
    runs-on: ubuntu-latest
    needs: [pre-ci, prime-cache]
    if: needs.pre-ci.outputs.should-build-pkg == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            packages

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: node-modules
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-build-${{ env.cache-name }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Check lint
        run: pnpm run lint-fast-pkg && pnpm run lint-pkg

      - name: Check types
        run: pnpm run ts-check-pkg

      - name: Build
        run: pnpm run build-pkg

      - name: Test
        run: pnpm run test-pkg

  ci-be:
    name: ci-be
    runs-on: ubuntu-latest
    needs: [pre-ci, prime-cache]
    if: needs.pre-ci.outputs.should-build-be == 'true' || needs.pre-ci.outputs.should-build-pkg == 'true'
    # TEMPORARY (wave 1 / WP-01). §6.2 has WP-01 delete packages and modules that
    # backend/ still imports (@monkeytype/funbox, @monkeytype/challenges). Removing
    # those imports is WP-10/WP-11's work, so this job cannot pass until they land.
    # It still runs and reports; it just must not block. Residual as of WP-01:
    # 3 x TS2307 in src/api/controllers/result.ts and src/utils/pb.ts.
    # REMOVE this line once `pnpm ts-check-be` is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            backend
            packages

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: node-modules
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-build-${{ env.cache-name }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Check lint
        run: pnpm run lint-fast-be && pnpm run lint-be

      - name: Check types
        run: pnpm run ts-check-be

      - name: Build
        run: pnpm run build-be

      - name: Test
        run: pnpm run test-be

  ci-fe:
    name: ci-fe
    runs-on: ubuntu-latest
    needs: [pre-ci, prime-cache]
    if: needs.pre-ci.outputs.should-build-fe == 'true' || needs.pre-ci.outputs.should-build-pkg == 'true'
    # TEMPORARY (wave 1 / WP-01). §6.2 has WP-01 delete the INV-118e controllers,
    # the INV-097 keymap/mascot set and the funbox/challenges packages while their
    # importers under frontend/src survive. Repointing those importers is
    # WP-05..WP-09's work, so this job cannot pass until they land. It still runs
    # and reports; it just must not block. Residual as of WP-01: 84 tsc errors,
    # all dangling imports of deleted modules plus their implicit-any cascade.
    # REMOVE this line once `pnpm ts-check-fe` is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            frontend
            packages

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create stub firebase config
        working-directory: ./frontend/src/ts/constants
        run: mv ./firebase-config-example.ts ./firebase-config.ts && cp ./firebase-config.ts ./firebase-config-live.ts

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: node-modules
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-build-${{ env.cache-name }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Check lint
        run: pnpm run lint-fast-fe && pnpm run lint-fe

      - name: Check types
        run: pnpm run ts-check-fe

      - name: Build
        env:
          # The build generates firebase-config-live.ts from these; CI's values
          # are stubs and never reach a deployed artefact (INF-101).
          FIREBASE_APIKEY: "ci-stub"
          FIREBASE_AUTHDOMAIN: "ci-stub.firebaseapp.com"
          FIREBASE_PROJECTID: "ci-stub"
          FIREBASE_STORAGEBUCKET: "ci-stub.appspot.com"
          FIREBASE_MESSAGINGSENDERID: "0"
          FIREBASE_APPID: "1:0:web:ci-stub"
        run: pnpm run build-fe

      - name: Test
        run: pnpm run test-fe

  ci-assets:
    name: ci-assets
    runs-on: ubuntu-latest
    needs: [pre-ci, prime-cache]
    if: needs.pre-ci.outputs.styles == 'true' || needs.pre-ci.outputs.should-build-pkg == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            frontend
            packages

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: node-modules
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-build-${{ env.cache-name }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Lint styles
        run: pnpm run lint-styles

      - name: Validate theme assets
        run: pnpm run check-assets
