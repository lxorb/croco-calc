name: CI

env:
  PNPM_VERSION: "10.28.1"
  NODE_VERSION: "24.11.0"
  # CI compiles the frontend but never deploys it, so these are deliberately
  # throwaway values. They still have to satisfy the two build guards, because
  # `vite build` runs in production mode here as everywhere else:
  #   - INF-107 rejects Google's public reCAPTCHA test key (prefix 6LeIxAcTAAAA)
  #     outright — it validates every response, so it is worse than no captcha.
  #     The stub below is the right shape and is not that key.
  #   - INF-013 rejects an unset BACKEND_URL, or one containing monkeytype.com.
  RECAPTCHA_SITE_KEY: "6LcCiStubAAAAAcrocoCalcCiOnlyNotARealSiteKey"
  BACKEND_URL: "http://localhost:5005"

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: group-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  pre-ci:
    name: pre-ci
    runs-on: ubuntu-latest
    outputs:
      should-build-be: ${{ steps.export-changes.outputs.should-build-be }}
      should-build-fe: ${{ steps.export-changes.outputs.should-build-fe }}
      should-build-pkg: ${{ steps.export-changes.outputs.should-build-pkg }}
      styles: ${{ steps.export-changes.outputs.styles }}
    steps:
      - name: Full checkout
        uses: actions/checkout@v6
        # paths filter doesn't need checkout on pr
        if: github.event_name != 'pull_request'

      - name: Detect changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            styles:
              - '**/*.{scss,css}'
              - 'frontend/static/themes/**'
            be-src:
              - 'backend/**/*'
              - 'backend/package.json'
            fe-src:
              - 'frontend/**/*.{ts,tsx,js,scss,html}'
              - 'frontend/**/package.json'
            pkg-src:
              - 'packages/**/*'

      - name: Export changes
        id: export-changes
        run: |
          echo "should-build-pkg=${{ steps.filter.outputs.pkg-src }}" >> $GITHUB_OUTPUT
          echo "should-build-be=${{ steps.filter.outputs.be-src }}" >> $GITHUB_OUTPUT
          echo "should-build-fe=${{ steps.filter.outputs.fe-src }}" >> $GITHUB_OUTPUT
          echo "styles=${{ steps.filter.outputs.styles }}" >> $GITHUB_OUTPUT

  prime-cache:
    name: prime-cache
    runs-on: ubuntu-latest
    needs: [pre-ci]
    steps:
      - name: Checkout pnpm-lock
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache node modules
        id: cache-pnpm
        uses: actions/cache@v5
        env:
          cache-name: node-modules
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-build-${{ env.cache-name }}-${{ hashFiles('pnpm-lock.yaml') }}
          lookup-only: true

      - if: ${{ steps.cache-pnpm.outputs.cache-hit != 'true' }}
        name: Full checkout
        uses: actions/checkout@v6

      - if: ${{ steps.cache-pnpm.outputs.cache-hit != 'true' }}
        name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - if: ${{ steps.cache-pnpm.outputs.cache-hit != 'true' }}
        name: Install dependencies
        run: pnpm install

  # INF-089: a credential must never reach the repository. This runs on every
  # push and pull request, independently of pre-ci's path filters — a secret can
  # land in any file, including ones no build job cares about.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
          # sha256 of gitleaks_8.30.0_linux_x64.tar.gz. INF-132 pins third-party
          # actions; a downloaded binary gets the same treatment.
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # A fresh checkout contains exactly the tracked tree, so this scans what
      # the repository actually publishes. Exit code 1 on any finding.
      - name: Scan the working tree
        run: gitleaks dir --config .gitleaks.toml --no-banner --redact --exit-code 1 .

  check-format:
    name: check-format
    runs-on: ubuntu-latest
    needs: [prime-cache]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: node-modules
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-build-${{ env.cache-name }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm run format-check

  ci-pkg:
    name: ci-pkg
    runs-on: ubuntu-latest
    needs: [pre-ci, prime-cache]
    if: needs.pre-ci.outputs.should-build-pkg == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            packages

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: node-modules
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-build-${{ env.cache-name }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Check lint
        run: pnpm run lint-fast-pkg && pnpm run lint-pkg

      - name: Check types
        run: pnpm run ts-check-pkg

      - name: Build
        run: pnpm run build-pkg

      - name: Test
        run: pnpm run test-pkg

  ci-be:
    name: ci-be
    runs-on: ubuntu-latest
    needs: [pre-ci, prime-cache]
    if: needs.pre-ci.outputs.should-build-be == 'true' || needs.pre-ci.outputs.should-build-pkg == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            backend
            packages

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: node-modules
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-build-${{ env.cache-name }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Check lint
        run: pnpm run lint-fast-be && pnpm run lint-be

      - name: Check types
        run: pnpm run ts-check-be

      - name: Build
        run: pnpm run build-be

      - name: Test
        run: pnpm run test-be

  ci-fe:
    name: ci-fe
    runs-on: ubuntu-latest
    needs: [pre-ci, prime-cache]
    if: needs.pre-ci.outputs.should-build-fe == 'true' || needs.pre-ci.outputs.should-build-pkg == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            frontend
            packages

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create stub firebase config
        working-directory: ./frontend/src/ts/constants
        run: mv ./firebase-config-example.ts ./firebase-config.ts && cp ./firebase-config.ts ./firebase-config-live.ts

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: node-modules
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-build-${{ env.cache-name }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Check lint
        run: pnpm run lint-fast-fe && pnpm run lint-fe

      - name: Check types
        run: pnpm run ts-check-fe

      - name: Build
        env:
          # The build generates firebase-config-live.ts from these; CI's values
          # are stubs and never reach a deployed artefact (INF-101).
          FIREBASE_APIKEY: "ci-stub"
          FIREBASE_AUTHDOMAIN: "ci-stub.firebaseapp.com"
          FIREBASE_PROJECTID: "ci-stub"
          FIREBASE_STORAGEBUCKET: "ci-stub.appspot.com"
          FIREBASE_MESSAGINGSENDERID: "0"
          FIREBASE_APPID: "1:0:web:ci-stub"
        run: pnpm run build-fe

      - name: Test
        run: pnpm run test-fe

  ci-assets:
    name: ci-assets
    runs-on: ubuntu-latest
    needs: [pre-ci, prime-cache]
    if: needs.pre-ci.outputs.styles == 'true' || needs.pre-ci.outputs.should-build-pkg == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            frontend
            packages

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: node-modules
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-build-${{ env.cache-name }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Lint styles
        run: pnpm run lint-styles

      - name: Validate theme assets
        run: pnpm run check-assets
