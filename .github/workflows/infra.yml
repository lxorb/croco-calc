name: infra

# INF-126, INF-079. `terraform plan` runs on pull requests touching infra/;
# `terraform apply` NEVER runs on push — only on an explicit workflow_dispatch
# against main, gated by the `prod-infra` environment's manual approval.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        type: choice
        required: true
        default: plan
        options: [plan, apply]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: infra
  cancel-in-progress: false

env:
  TF_VERSION: "1.14.8"
  TF_WORKING_DIR: infra/terraform/prod
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: terraform plan
    if: github.event_name == 'pull_request' || inputs.action == 'plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive ../

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_AZUREAD: "true"
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_AZUREAD: "true"
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TF_VAR_recaptcha_secret: ${{ secrets.RECAPTCHA_SECRET }}
        # No pipe. GitHub's default shell is `bash -e {0}` WITHOUT pipefail, so
        # `terraform plan | tee plan.txt` would report the exit status of `tee`
        # and a failed plan would sail through green with its error text posted
        # to the PR as if it were a plan.
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan.txt
          retention-days: 5

      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const plan = fs.readFileSync(`${process.env.TF_WORKING_DIR}/plan.txt`, "utf8");
            const body = [
              "### terraform plan",
              "```",
              plan.length > 60000 ? `${plan.slice(0, 60000)}\n… truncated, see the tfplan artifact` : plan,
              "```",
            ].join("\n");
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  apply:
    name: terraform apply
    # INF-079: manual dispatch on main only. The `prod-infra` environment must
    # carry a required reviewer — that is where the approval gate lives.
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod-infra
    steps:
      - uses: actions/checkout@v6

      # INF-156: the cost table is a gate, not a note. The authoritative INF-037
      # table lives in docs/requirements/06-infra-and-ops.md, so that is the
      # file this gate reads — checking anything else makes the gate vacuous.
      # See docs/RUNBOOK.md section 1 for the verified rates and the citations
      # that have to be transcribed into the `source` column to clear it.
      # The pattern matches a markdown TABLE CELL holding the italic marker
      # `*UNVERIFIED*` — not the bare word. INF-156's own prose has to be able
      # to name the marker it forbids, and a naive `grep -c UNVERIFIED` made the
      # gate fire on that prose, i.e. it could never pass once the table was
      # actually verified. Keep the `|` anchor.
      - name: Assert the INF-037 cost table is verified
        run: |
          table=docs/requirements/06-infra-and-ops.md
          rows=$(grep -c '|.*\*UNVERIFIED\*' "$table" || true)
          if [ "$rows" -ne 0 ]; then
            echo "::error file=$table::$rows row(s) of the INF-037 cost table still read *UNVERIFIED*; terraform apply is blocked (INF-156). Fill the source column with a checked citation first."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_AZUREAD: "true"
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_AZUREAD: "true"
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TF_VAR_recaptcha_secret: ${{ secrets.RECAPTCHA_SECRET }}
        run: terraform apply -input=false -auto-approve

      # INF-080: a second consecutive apply must report no changes.
      - name: Assert idempotency
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_USE_AZUREAD: "true"
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TF_VAR_recaptcha_secret: ${{ secrets.RECAPTCHA_SECRET }}
        run: terraform plan -input=false -detailed-exitcode

      # INF-086a: the deployed FQDN is written back as a repository variable so
      # it can never drift from what the frontend build uses.
      - name: Publish api_base_url as vars.BACKEND_URL
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GH_VARIABLES_TOKEN }}
        run: |
          api_base_url=$(terraform output -raw api_base_url)
          echo "api_base_url=$api_base_url"
          gh variable set BACKEND_URL --repo "${{ github.repository }}" --body "$api_base_url"
