<!--
  Results screen (WP-07). CP-090 … CP-131.

  Icons are Iconify placeholders: every `[data-icon]` span is filled in by
  `frontend/src/ts/test/result.ts` at module load, which renders the shared
  `Icon` component into it (C10, CP-001). Writing the ids here rather than in
  the module keeps them auditable by `frontend/vite-plugins/icons.ts`, which
  scans `.html` as well as `.ts` (CP-002).

  The eight CP-188 hooks (`data-score`, `data-correct`, `data-wrong`,
  `data-acc`, `data-tpm`, `data-answered`, `data-consistency`, `data-afk`)
  live on `#result` and are written by `result.ts` on every render.
-->
<div id="result" class="content-grid full-width hidden" tabindex="-1">
  <div class="wrapper">
    <div class="stats">
      <!-- CP-091.1 / CP-092 — the main metric, in the upstream headline scale. -->
      <div class="group score">
        <div class="top">
          <div class="text">score</div>
          <!-- CP-095 — the PB crown, now measured in score. -->
          <div
            class="crown hidden"
            aria-label=""
            data-balloon-pos="up"
            data-balloon-length="medium"
          >
            <span
              class="crownIcon question"
              data-icon="ph:question-bold"
            ></span>
            <span class="crownIcon normal" data-icon="ph:crown-bold"></span>
            <span class="crownIcon slash" data-icon="ph:prohibit-bold"></span>
            <span class="crownIcon warning" data-icon="ph:warning-bold"></span>
          </div>
        </div>
        <div class="bottom" aria-label="" data-balloon-pos="up">-</div>
      </div>

      <!-- CP-091.2 / CP-093 — correct and wrong, adjacent, below the score. -->
      <div class="group correctwrong">
        <div class="subgroup correct">
          <div class="top">correct</div>
          <div class="bottom">-</div>
        </div>
        <div class="subgroup wrong">
          <div class="top">wrong</div>
          <div class="bottom">-</div>
        </div>
      </div>

      <!-- CP-091.3 / CP-094 -->
      <div class="group acc">
        <div class="top">acc</div>
        <div class="bottom" aria-label="" data-balloon-pos="up">-</div>
      </div>
    </div>

    <!-- CP-096 — test type, tpm, tasks, avg time, consistency, time, daily
         leaderboard. `other` is upstream's `.group.info`, kept last: it is the
         only home for the C37 idle flag, CP-109's invalid marker and the
         repeated-run marker, none of which CP-096 places elsewhere. -->
    <div class="stats morestats">
      <div class="group testType">
        <div class="top">test type</div>
        <div class="bottom">-</div>
      </div>
      <div class="group tpm">
        <div class="top">tpm</div>
        <div class="bottom" aria-label="" data-balloon-pos="up">-</div>
      </div>
      <div class="group tasks">
        <div class="top">tasks</div>
        <div class="bottom" aria-label="" data-balloon-pos="up">-</div>
      </div>
      <div class="group avgTime">
        <div class="top">avg time</div>
        <div class="bottom" aria-label="" data-balloon-pos="up">-</div>
      </div>
      <div class="group flat consistency">
        <div class="top">consistency</div>
        <div class="bottom" aria-label="" data-balloon-pos="up">-</div>
      </div>
      <div class="group time">
        <div class="top">time</div>
        <div class="bottom" aria-label="" data-balloon-pos="up">
          <div class="text">-</div>
          <div class="afk"></div>
          <div class="timeToday"></div>
        </div>
      </div>
      <div class="group dailyLeaderboard hidden">
        <div class="top">daily leaderboard</div>
        <div
          id="dailyLeaderboardRank"
          aria-label="Show daily leaderboard"
          data-balloon-pos="up"
          class="bottom"
        >
          -
        </div>
      </div>
      <div class="group info hidden">
        <div class="top">other</div>
        <div class="bottom">-</div>
      </div>
    </div>

    <div class="chart">
      <!-- CP-119 as amended by master C15 (tags deleted): four buttons. -->
      <div class="chartLegend">
        <button class="text active" tabindex="-1" data-id="scale">
          <span data-icon="ph:chart-line-bold"></span>
          <div class="text">scale</div>
        </button>
        <button class="text" tabindex="-1" data-id="pb">
          <span data-icon="ph:crown-bold"></span>
          <div class="text">pb</div>
        </button>
        <button class="text" tabindex="-1" data-id="tpm">
          <div class="line dashed"></div>
          <div class="text">tpm</div>
        </button>
        <button class="text" tabindex="-1" data-id="wrong">
          <span data-icon="ph:x-bold"></span>
          <div class="text">wrong</div>
        </button>
      </div>
      <!-- CP-112 / master C27 — the canvas is kept, its id is not. -->
      <canvas id="resultChart"></canvas>
    </div>

    <div class="bottom">
      <!-- CP-126 — every committed task as `<prompt> = <your answer>`. -->
      <div id="resultTaskHistory" class="hidden">
        <div class="title">
          <span>task history</span>
          <button
            id="copyTaskListButton"
            class="textButton"
            aria-label="Copy list"
            data-balloon-pos="up"
            style="display: inline-block"
            tabindex="-1"
          >
            <span data-icon="ph:text-align-left-bold"></span>
          </button>
          <button
            id="copyMissedTaskListButton"
            class="textButton"
            aria-label="Copy missed list"
            data-balloon-pos="up"
            tabindex="-1"
          >
            <span data-icon="ph:x-bold"></span>
          </button>
        </div>
        <div class="tasks"></div>
      </div>

      <!-- CP-128 -->
      <button id="retrySavingResultButton" class="danger hidden">
        <span data-icon="ph:arrow-counter-clockwise-bold"></span>
        Retry saving result
      </button>

      <!-- CP-122 / CP-123 as amended by master C19: four buttons, no
           `practise mistakes`. -->
      <div class="buttons">
        <button
          class="text"
          id="nextTestButton"
          aria-label="Next test"
          role="button"
          data-balloon-pos="down"
        >
          <span data-icon="ph:caret-right-bold" data-icon-fw></span>
        </button>
        <button
          class="text"
          id="repeatTestButton"
          aria-label="Repeat test"
          role="button"
          data-balloon-pos="down"
        >
          <span data-icon="ph:arrows-clockwise-bold" data-icon-fw></span>
        </button>
        <button
          class="text"
          id="toggleTaskHistoryButton"
          aria-label="Toggle task history"
          role="button"
          data-balloon-pos="down"
        >
          <span data-icon="ph:list-bullets-bold" data-icon-fw></span>
        </button>
        <button
          class="text"
          id="saveScreenshotButton"
          aria-label="Copy screenshot to clipboard&#10;(shift click to download)"
          role="button"
          data-balloon-pos="down"
          data-balloon-break
        >
          <span class="idle" data-icon="ph:image-bold" data-icon-fw></span>
          <span
            class="shift hidden"
            data-icon="ph:download-simple-bold"
            data-icon-fw
          ></span>
        </button>
      </div>
    </div>

    <!-- CP-127 -->
    <div class="loginTip">
      <a href="/login" router-link>Sign in</a>
      to save your result
    </div>
    <!-- CP-129 — filled in from the shared domain constant by result.ts. -->
    <div class="ssWatermark hidden"></div>
  </div>
</div>
