<div class="page pageTest full-width content-grid hidden" data-nosnippet>
  <mount data-component="testconfig" class="full-width"></mount>

  <div id="testInitFailed" class="content-grid hidden">
    <div class="message">
      <div class="text">
        Task generation failed. Please try different settings or refresh the
        page. If the problem persists, please contact support.
      </div>
      <div class="error"></div>
      <button class="active restart">
        <mount data-component="restarticon" class="contents"></mount>
        Restart
      </button>
    </div>
  </div>
  <div id="tasksTest" class="content-grid full-width-padding">
    <mount data-component="testmodesnotice"></mount>

    <mount data-component="livestatstexttop"></mount>
    <mount data-component="livestatsmini" class="full-width"></mount>
    <div id="tasksWrapper" class="content-grid full-width" translate="no">
      <textarea
        id="tasksInput"
        class="full-width"
        autocomplete="off"
        autocapitalize="none"
        autocorrect="off"
        inputmode="decimal"
        data-gramm="false"
        data-gramm_editor="false"
        data-enable-grammarly="false"
        data-bwignore
        data-1p-ignore
        data-lpignore="true"
        data-form-type="other"
        list="autocompleteOff"
        spellcheck="false"
      ></textarea>
      <mount data-component="outoffocuswarning" class="contents"></mount>
      <mount data-component="prestarthint" class="contents"></mount>
      <div id="caret" class="full-width default"></div>
      <div id="tasks" class="full-width preStart" data-state="idle"></div>
    </div>

    <mount data-component="answersymbols"></mount>

    <button
      id="restartTestButton"
      aria-label="Restart Test"
      data-balloon-pos="down"
      class="text"
    >
      <mount data-component="restarticon" class="contents"></mount>
    </button>
    <mount data-component="livestatstextbottom"></mount>
  </div>
  <div class="loading hidden">
    <mount data-component="loadingspinner" class="contents"></mount>
  </div>
  <load src="./test-result.html" />
</div>
