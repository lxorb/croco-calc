name: croco-calc
version: "3.8"
services:
  mongodb:
    container_name: croco-calc-mongodb
    image: mongo:5.0.13
    restart: on-failure
    ports:
      - "${DOCKER_DB_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db

  api-server:
    container_name: croco-calc-api-server
    build:
      dockerfile_inline: |
        FROM node:24.11.0
        RUN npm i -g pnpm@10.28.1
        RUN mkdir /pnpm-store && chown -R 1000:1000 /pnpm-store
    user: "node" ##this works as long as your local user has uid=1000
    restart: on-failure
    depends_on:
      - mongodb
    environment:
      - DB_URI=mongodb://mongodb:27017
    ports:
      - "${DOCKER_SERVER_PORT:-5005}:5005"
    volumes:
      - ../../:/croco-calc
    entrypoint: 'bash -c "echo starting, this may take a while... \
      && cd /croco-calc \
      && pnpm config set store-dir /pnpm-store
      && pnpm i \
      && npm run dev-be"'

volumes:
  mongo-data:
