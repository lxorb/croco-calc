# Self-hosting compose file for croco calc.
#
# The production frontend is an assets-only Cloudflare Worker, so there is no
# frontend image here (INF-032, INV-021) — build `frontend/dist` and serve it
# from any static host, or run `pnpm dev-fe`.
#
# The cache and queue layer is gone (INF-063 … INF-069): the daily and weekly
# leaderboards run on MongoDB and the queues moved into the cron job runner.

services:
  croco-calc-backend:
    container_name: croco-calc-backend
    image: ghcr.io/lxorb/croco-calc-api:latest
    ports:
      - "${BACKEND_PORT:-5005}:5005"
    restart: on-failure
    environment:
      - DB_NAME=crococalc
      - DB_URI=mongodb://croco-calc-mongodb:27017
      - FRONTEND_URL=${CROCOCALC_FRONTENDURL}
      - RECAPTCHA_SECRET=${RECAPTCHA_SECRET:-}
    volumes:
      #uncomment to enable the account system, check the SELF_HOSTING.md file
      #- type: bind
      #  source: ./serviceAccountKey.json
      #  target: /app/backend/src/credentials/serviceAccountKey.json
      #  read_only: true
      - type: bind
        source: ./backend-configuration.json
        target: /app/backend/dist/backend-configuration.json
        read_only: true
    depends_on:
      croco-calc-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "-v", "localhost", "5005"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 5s

  croco-calc-mongodb:
    container_name: croco-calc-mongodb
    # 8.0 to match Atlas, and because $setWindowFields / $merge are load-bearing.
    image: mongo:8.0
    restart: on-failure
    volumes:
      - mongo-data:/data/db
    #uncomment if you want to expose the mongodb server
    #ports:
    #  - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 10s

volumes:
  mongo-data:
    name: croco_calc_mongo_data
